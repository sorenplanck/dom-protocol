name: CI

# Phase 1.4 — cross-platform equivalence CI. Builds, clippies, and
# tests the workspace on the four host matrices the protocol must
# remain deterministic across. All five build-test hosts remain REQUIRED.
# Only the dedicated Windows PMMR leg is advisory, exactly as before.
# V2: checked optimization, compiler-aware caches, parallel independent vectors
# and phase measurements. No test, feature surface or release blocker removed.
# Base: sorenplanck/dom-protocol ec8553078c726908fc7d441a892681371f0830f3.

on:
  workflow_dispatch:
    inputs:
      optimized:
        description: Use opt-level=2 with all checks enabled; false uses opt-level=0 for comparison.
        required: true
        default: true
        type: boolean
  push:
    branches: [main, mainnetswap]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, mainnetswap]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

# Read-only repository token. Cache/artifact services use their own runtime token.
# No pull_request_target, no privileged publishing and no new external action.
permissions:
  contents: read
# Explicit bash enables pipefail on all hosts, including Windows.
# A failed Cargo/Node process must not be hidden by a successful tee.
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # randomx-rs requires the C library to build; integration tests are
  # excluded across the matrix because the FULL_MEM dataset (~2 GB) is
  # far above GitHub-hosted runner budgets. Single-host validation of
  # the heavy integration suite is tracked separately.

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build-test:
    name: build + clippy + test (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    # Same as the previous implicit GitHub default; not a performance shortcut.
    # Windows remains REQUIRED in this job; experimental is not used here.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-latest
            experimental: false
          - host: linux-arm64
            runner: ubuntu-22.04-arm
            experimental: false
          - host: macos-arm64
            runner: macos-latest
            experimental: false
          - host: macos-x86_64
            runner: macos-15-intel
            experimental: false
          - host: windows-x86_64
            runner: windows-latest
            experimental: true
    # Optimize CPU-heavy Rust without switching to --release or changing features.
    # Keep full debug information, debug assertions and arithmetic overflow checks.
    # Align dev/test settings so profile differences do not cause avoidable rebuilds.
    # No changes to test counts, timeouts, RandomX, KDF settings or test threads.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.optimized == 'false' && '0' || '2' }}"
      CARGO_PROFILE_TEST_OPT_LEVEL: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.optimized == 'false' && '0' || '2' }}"
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_DEV_DEBUG: "2"
      CARGO_PROFILE_TEST_DEBUG: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Reclaim ~30 GB of preinstalled SDKs this build never uses. The
      # `cargo build --workspace --all-targets` step links the dom-integration-tests
      # test binaries (randomx-rs + full workspace), which exhausts the
      # GitHub-hosted runner's ~14 GB free disk and fails with
      # "rustc-LLVM ERROR: No space left on device". Linux-only: the macOS and
      # Windows runners don't have these paths and aren't disk-constrained here.
      - name: Free disk space (Linux runners)
        if: runner.os == 'Linux'
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules
          sudo docker image prune -af || true
          echo "Disk after cleanup:"; df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
        id: rust
      - name: Prepare benchmark instrumentation
        shell: bash
        run: |
          set -euo pipefail
          bench="$RUNNER_TEMP/dom-ci-benchmark"
          mkdir -p "$bench"
          printf 'phase\tseconds\texit_code\n' > "$bench/timings.tsv"
          cat > "$bench/timer.sh" <<'BASH'
          ci_timer_start() {
            CI_TIMER_PHASE="$1"
            CI_TIMER_BEGIN=$SECONDS
            trap 'ci_timer_finish "$?"' EXIT
          }
          ci_timer_finish() {
            local rc="$1"
            local elapsed=$((SECONDS - CI_TIMER_BEGIN))
            trap - EXIT
            if ! printf '%s\t%s\t%s\n' "$CI_TIMER_PHASE" "$elapsed" "$rc" \
                >> "$RUNNER_TEMP/dom-ci-benchmark/timings.tsv"; then
              echo '::error::Could not record phase timing' >&2
              if [ "$rc" -eq 0 ]; then rc=1; fi
            fi
            exit "$rc"
          }
          BASH
          {
            printf 'commit=%s\njob=%s\nos=%s\narch=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'dev_opt_level=%s\ntest_opt_level=%s\n' "$CARGO_PROFILE_DEV_OPT_LEVEL" "$CARGO_PROFILE_TEST_OPT_LEVEL"
            printf 'test_debug_assertions=%s\ntest_overflow_checks=%s\n' "$CARGO_PROFILE_TEST_DEBUG_ASSERTIONS" "$CARGO_PROFILE_TEST_OVERFLOW_CHECKS"
            printf 'full_debug_info=%s\nincremental=%s\n' "$CARGO_PROFILE_TEST_DEBUG" "$CARGO_INCREMENTAL"
            rustc -Vv
            cargo -V
            uname -a
            case "$RUNNER_OS" in
              Linux) nproc; free -h; df -h / ;;
              macOS) sysctl hw.ncpu hw.memsize; df -h / ;;
              Windows) printf 'NUMBER_OF_PROCESSORS=%s\n' "${NUMBER_OF_PROCESSORS:-unknown}" ;;
            esac
          } | tee "$bench/environment.txt"
      - name: Cache cargo registry + target
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        # Cache hits never skip builds or tests. Cargo still validates fingerprints.
        # The compiler/profile prefix prevents stale incompatible target restores.
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/**/incremental
            !target/cargo-timings
          key: dom-ci-v2-build-test-${{ matrix.host }}-${{ steps.rust.outputs.cachekey }}-o${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-checks-target-${{ hashFiles('**/Cargo.lock', 
            '**/Cargo.toml', 'rust-toolchain', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            dom-ci-v2-build-test-${{ matrix.host }}-${{ steps.rust.outputs.cachekey }}-o${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-checks-target-

        id: cargo-cache
      - name: Cache cargo registry only (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        # Cache hits never skip builds or tests. Cargo still validates fingerprints.
        # The compiler/profile prefix prevents stale incompatible target restores.
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: dom-ci-v2-build-test-${{ matrix.host }}-${{ steps.rust.outputs.cachekey }}-o${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-checks-registry-${{ hashFiles('**/Cargo.lock', 
            '**/Cargo.toml', 'rust-toolchain', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            dom-ci-v2-build-test-${{ matrix.host }}-${{ steps.rust.outputs.cachekey }}-o${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-checks-registry-

      # secp256k1-zkp and randomx-rs link against C — make sure
      # build-essential / Xcode CLT / MSVC are present. On Linux runners
      # these are preinstalled; macOS ships clang; Windows needs Visual
      # C++ Build Tools which `windows-latest` provides by default.
        id: cargo-cache-windows
      - name: Install Linux build tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      # The interoperability layer is Linux-only in substance: its custody and
      # live-node crates are built on retained directory capabilities, rustix
      # and Unix permission modes. The non-Linux legs therefore build the
      # NODE's twenty-nine crates rather than the workspace. The node list is
      # named positively because it is immutable in this branch; excluding the
      # layer instead would rot on every crate added to it.
      - name: Set build scope (full workspace on Linux, node crates elsewhere)
        shell: bash
        run: |
          NODE="dom-agent-runner dom-chain dom-cli dom-config dom-consensus dom-core
                dom-crypto dom-explorer dom-faucet dom-integration-tests dom-mempool
                dom-node dom-pmmr dom-pow dom-rpc dom-serialization dom-slate dom-store
                dom-test-runner dom-test-vectors dom-tx dom-wallet dom-wallet-app
                dom-wallet-core-api dom-wallet-crypto dom-wallet-keys
                dom-wallet-recovery dom-wallet2 dom-wire"
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "SCOPE_BUILD=--workspace" >> "$GITHUB_ENV"
            echo "SCOPE_TEST=--workspace --exclude dom-integration-tests --exclude dom-node" >> "$GITHUB_ENV"
          else
            B=""; T=""
            for c in $NODE; do
              B="$B -p $c"
              case "$c" in dom-integration-tests|dom-node) ;; *) T="$T -p $c";; esac
            done
            echo "SCOPE_BUILD=$B" >> "$GITHUB_ENV"
            echo "SCOPE_TEST=$T" >> "$GITHUB_ENV"
          fi

      # `shell: bash` on every step below is load-bearing, not style: the
      # Windows runner defaults to PowerShell, where `$SCOPE_BUILD` does not
      # expand an environment variable. It would silently become empty and the
      # command would build the whole workspace unscoped — failing again, for a
      # reason the log would not show.
      - name: cargo build
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/dom-ci-benchmark/timer.sh"
          ci_timer_start build-all-targets
          cargo build $SCOPE_BUILD --all-targets --locked --timings 2>&1 | tee "$RUNNER_TEMP/dom-ci-benchmark/build-all-targets.log"


      - name: cargo clippy -- -D warnings
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/dom-ci-benchmark/timer.sh"
          ci_timer_start clippy-all-targets
          cargo clippy $SCOPE_BUILD --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/dom-ci-benchmark/clippy-all-targets.log"


      - name: cargo test (excluding integration and dom-node)
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/dom-ci-benchmark/timer.sh"
          ci_timer_start workspace-tests
          cargo test $SCOPE_TEST --all-targets --locked --timings 2>&1 | tee "$RUNNER_TEMP/dom-ci-benchmark/workspace-tests.log"


      - name: cargo test -p dom-node --all-targets (serial)
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/dom-ci-benchmark/timer.sh"
          ci_timer_start node-tests-serial
          cargo test -p dom-node --all-targets --locked --timings -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/dom-ci-benchmark/node-tests-serial.log"


      - name: Publish benchmark summary
        if: always()
        shell: bash
        env:
          CI_CACHE_HIT: ${{ runner.os == 'Windows' && steps.cargo-cache-windows.outputs.cache-hit || steps.cargo-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          bench="$RUNNER_TEMP/dom-ci-benchmark"
          {
            printf '## CI benchmark — %s / %s\n\n' "$GITHUB_JOB" "$RUNNER_ARCH"
            if [ -f "$bench/environment.txt" ]; then
              printf '<details><summary>Compiler, runner and checks</summary>\n\n```text\n'
              cat "$bench/environment.txt"
              printf '```\n</details>\n\n'
            fi
            printf 'Exact cache match: `%s` (false/empty may mean fallback, miss or an unavailable cache step).\n\n' "${CI_CACHE_HIT:-not-reported}"
            printf '| Phase | Duration | Exit code |\n|---|---:|---:|\n'
            if [ -f "$bench/timings.tsv" ]; then
              while IFS=$'\t' read -r phase seconds code; do
                [ "$phase" != 'phase' ] || continue
                printf '| %s | %dm %02ds | %s |\n' "$phase" "$((seconds / 60))" "$((seconds % 60))" "$code"
              done < "$bench/timings.tsv"
            fi
            printf '\nMeasured commands only. Checkout, cache transfer, queueing and other jobs are not included.\n'
            printf 'Use the workflow Total duration for wall-clock comparison. A first run may have a cold target cache.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$bench/workspace-tests.log" ]; then
            # Parse only explicit libtest summaries. These are per-binary runtimes,
            # not compilation times or the wall-clock duration of the full workflow.
            awk '
              { gsub(/\033\[[0-9;]*m/, "") }
              /Running unittests |Running tests\// { suite=$0; sub(/^[[:space:]]+/, "", suite) }
              /test result:/ && /finished in [0-9.]+s/ {
                elapsed=$0
                sub(/.*finished in /, "", elapsed)
                sub(/s.*/, "", elapsed)
                if (suite != "") printf "%s\t%s\n", elapsed, suite
              }
            ' "$bench/workspace-tests.log" | LC_ALL=C sort -k1,1nr > "$bench/test-binary-times.tsv"
            if [ -s "$bench/test-binary-times.tsv" ]; then
              {
                printf '\n### Slowest test binaries (reported by libtest)\n\n'
                printf '| Seconds | Test binary |\n|---:|---|\n'
                sed -n '1,10p' "$bench/test-binary-times.tsv" | while IFS=$'\t' read -r seconds binary; do
                  printf '| %s | `%s` |\n' "$seconds" "$binary"
                done
                printf '\nDiagnostic list only; custom harnesses without a libtest summary are not counted here.\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ -d target/cargo-timings ]; then
            mkdir -p "$bench"
            cp -R target/cargo-timings "$bench/"
          fi
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark-${{ matrix.host }}
          path: ${{ runner.temp }}/dom-ci-benchmark/
          if-no-files-found: warn
          retention-days: 14
  supply-chain:
    name: "supply chain: cargo deny + cargo audit"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

        id: rust
      - name: Cache cargo registry + installed tools
        uses: actions/cache@v4
        # Cache hits never skip builds or tests. Cargo still validates fingerprints.
        # The compiler/profile prefix prevents stale incompatible target restores.
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: dom-ci-v2-supply-chain-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-original-tools-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 
            'rust-toolchain', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            dom-ci-v2-supply-chain-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-original-tools-

        id: cargo-cache
      - name: Install cargo-deny and cargo-audit
        run: |
          command -v cargo-deny >/dev/null || cargo install --locked cargo-deny
          command -v cargo-audit >/dev/null || cargo install --locked cargo-audit

      # deny.toml is the dom-shield F1 supply-chain detector: rev-pinned git
      # sources only, frozen license set, no yanked crates. cargo audit scans
      # Cargo.lock against the RustSec advisory database. Both were policy-only
      # before this job; now they gate.
      - name: cargo deny check
        run: cargo deny check

      - name: cargo audit
        run: cargo audit

  interop-evm-contracts:
    name: "interop: EVM custody contracts"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Same release used by the local F3 evidence and gas thresholds.
          version: 1.7.1

      # Vendored dependencies are intentionally absent. Install the exact
      # audited tags on every run so a clean checkout can reproduce the
      # deployed custody bytecode and its adversarial suite.
      - name: Install pinned Solidity dependencies
        working-directory: contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
          forge install foundry-rs/forge-std@v1.9.6 --no-git

      - name: Contract license headers are resolved
        run: |
          contract_scopes=(contracts/src contracts/script contracts/test)
          test "$(find "${contract_scopes[@]}" -name '*.sol' -type f -print | wc -l)" = \
               "$(grep -rl '^// SPDX-License-Identifier: MIT$' "${contract_scopes[@]}" --include='*.sol' | wc -l)"
          ! grep -R -E 'TBD-A2|SPDX-License-Identifier: UNLICENSED' \
            "${contract_scopes[@]}" --include='*.sol'

      - name: forge fmt --check
        working-directory: contracts
        run: forge fmt --check

      - name: forge build
        working-directory: contracts
        run: forge build

      - name: forge test
        working-directory: contracts
        run: forge test -vvv

      # Runs the Rust adapter/engine against the deployed bytecode and refuses
      # a green result unless every named F3/F4 scenario actually executed.
      - name: Anvil cross-chain end-to-end gate (12 F3 + 6 F4)
        run: ./scripts/e2e_anvil.sh

      # Independent implementation of the ecrecover construction used to
      # authenticate address(t*G), separate from both Solidity and Rust.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Independent ecrecover verification
        run: |
          npm install --no-audit --no-fund ethereumjs-util@7.1.5
          node contracts/test/verify_ecrecover_trick.js | tee ecrecover.log
          grep -q 'VERIFICADO (5/5)' ecrecover.log

  interop-real-backend:
    name: "interop: real cryptographic backend + layer guards"
    runs-on: ubuntu-latest
    # The interop absorption tripled this workspace. A cold-cache run of the
    # real-backend suites alone exceeds the previous 45-minute budget, which
    # cancelled the job after every one of its gates had already passed.
    timeout-minutes: 90
    # Optimize CPU-heavy Rust without switching to --release or changing features.
    # Keep full debug information, debug assertions and arithmetic overflow checks.
    # Align dev/test settings so profile differences do not cause avoidable rebuilds.
    # No changes to test counts, timeouts, RandomX, KDF settings or test threads.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.optimized == 'false' && '0' || '2' }}"
      CARGO_PROFILE_TEST_OPT_LEVEL: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.optimized == 'false' && '0' || '2' }}"
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_DEV_DEBUG: "2"
      CARGO_PROFILE_TEST_DEBUG: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Every other build job here caches cargo; this one compiled the whole
      # tree cold on every run. Same gates, nothing weakened.
        with:
          components: clippy
        id: rust
      - name: Prepare benchmark instrumentation
        shell: bash
        run: |
          set -euo pipefail
          bench="$RUNNER_TEMP/dom-ci-benchmark"
          mkdir -p "$bench"
          printf 'phase\tseconds\texit_code\n' > "$bench/timings.tsv"
          cat > "$bench/timer.sh" <<'BASH'
          ci_timer_start() {
            CI_TIMER_PHASE="$1"
            CI_TIMER_BEGIN=$SECONDS
            trap 'ci_timer_finish "$?"' EXIT
          }
          ci_timer_finish() {
            local rc="$1"
            local elapsed=$((SECONDS - CI_TIMER_BEGIN))
            trap - EXIT
            if ! printf '%s\t%s\t%s\n' "$CI_TIMER_PHASE" "$elapsed" "$rc" \
                >> "$RUNNER_TEMP/dom-ci-benchmark/timings.tsv"; then
              echo '::error::Could not record phase timing' >&2
              if [ "$rc" -eq 0 ]; then rc=1; fi
            fi
            exit "$rc"
          }
          BASH
          {
            printf 'commit=%s\njob=%s\nos=%s\narch=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'dev_opt_level=%s\ntest_opt_level=%s\n' "$CARGO_PROFILE_DEV_OPT_LEVEL" "$CARGO_PROFILE_TEST_OPT_LEVEL"
            printf 'test_debug_assertions=%s\ntest_overflow_checks=%s\n' "$CARGO_PROFILE_TEST_DEBUG_ASSERTIONS" "$CARGO_PROFILE_TEST_OVERFLOW_CHECKS"
            printf 'full_debug_info=%s\nincremental=%s\n' "$CARGO_PROFILE_TEST_DEBUG" "$CARGO_INCREMENTAL"
            rustc -Vv
            cargo -V
            uname -a
            case "$RUNNER_OS" in
              Linux) nproc; free -h; df -h / ;;
              macOS) sysctl hw.ncpu hw.memsize; df -h / ;;
              Windows) printf 'NUMBER_OF_PROCESSORS=%s\n' "${NUMBER_OF_PROCESSORS:-unknown}" ;;
            esac
          } | tee "$bench/environment.txt"
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        # Cache hits never skip builds or tests. Cargo still validates fingerprints.
        # The compiler/profile prefix prevents stale incompatible target restores.
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/**/incremental
            !target/cargo-timings
          key: dom-ci-v2-interop-real-backend-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-o${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-checks-target-${{ 
            hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            dom-ci-v2-interop-real-backend-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-o${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-checks-target-

      # G-F2 requires the full F1 regression to stay green against the REAL
      # cryptographic backend rather than the disabled one. The suites live in
      # dom-vault and dom-leg behind `real-dom-adaptor`, and
      # `f2_e2e_018_the_f1_real_backend_regression_stays_wired_in_ci` reads this
      # file and fails if either command is ever removed — so the regression
      # cannot be dropped while the gate still claims it.
        id: cargo-cache
      - name: F1 real-backend regression (vault)
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/dom-ci-benchmark/timer.sh"
          ci_timer_start real-backend-vault
          cargo test -p dom-vault --features real-dom-adaptor --locked 2>&1 | tee "$RUNNER_TEMP/dom-ci-benchmark/real-backend-vault.log"


        shell: bash
      - name: F1 real-backend regression (leg)
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/dom-ci-benchmark/timer.sh"
          ci_timer_start real-backend-leg
          cargo test -p dom-leg --features real-dom-adaptor --locked 2>&1 | tee "$RUNNER_TEMP/dom-ci-benchmark/real-backend-leg.log"


      # The layer's executable guards. Each fails the build on its own finding;
      # none of them is advisory.
        shell: bash
      - name: Architecture boundaries
        run: ./scripts/check-boundaries.sh

      - name: Ratification signatures
        run: |
          command -v minisign >/dev/null || sudo apt-get install -y minisign
          ./scripts/check-ratification-signatures.sh

      - name: F7 DOM surfaces
        run: ./scripts/f7-validate-dom-surfaces.sh

      - name: Layer guards
        run: |
          ./scripts/check-adaptor-two-nonce.sh
          ./scripts/check-claim-adaptor-provenance.sh
          ./scripts/check-hash-domains.sh
          ./scripts/check-normative-adjudication.sh
          ./scripts/check-policy-topology.sh
          ./scripts/check-shared-output-bp.sh

      # The one named exception to node byte-identity. This guard fails on the
      # day the node line adopts the same fix, which is when the exception ends
      # and byte identity must be restored. It fetches the release commit by SHA
      # (one commit) because actions/checkout is shallow by default.
      - name: Node-test exception (byte-identity)
        run: ./scripts/check-node-test-exception.sh

      - name: Release-surface boundary
        run: ./scripts/check-release-surface.sh

      - name: Relay fault-injection release boundary
        run: ./scripts/check-relay-fault-surface.sh

      # Feature surfaces no other job reaches. `--all-targets` builds the
      # default feature set only, so a crate's optional surface can rot
      # unnoticed: `mod signer_e2e` is gated on `all(test, evidence-only)`,
      # which neither `cargo test --workspace` nor a plain clippy run compiles.
      - name: Optional feature surfaces
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/dom-ci-benchmark/timer.sh"
          ci_timer_start optional-feature-surfaces
          cargo clippy -p dom-scriptless-store --features evidence-only --all-targets --locked -- -D warnings
          cargo test  -p dom-scriptless-store --features evidence-only --locked
          cargo clippy -p store --features failpoints --all-targets --locked -- -D warnings

        shell: bash
      - name: Publish benchmark summary
        if: always()
        shell: bash
        env:
          CI_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          bench="$RUNNER_TEMP/dom-ci-benchmark"
          {
            printf '## CI benchmark — %s / %s\n\n' "$GITHUB_JOB" "$RUNNER_ARCH"
            if [ -f "$bench/environment.txt" ]; then
              printf '<details><summary>Compiler, runner and checks</summary>\n\n```text\n'
              cat "$bench/environment.txt"
              printf '```\n</details>\n\n'
            fi
            printf 'Exact cache match: `%s` (false/empty may mean fallback, miss or an unavailable cache step).\n\n' "${CI_CACHE_HIT:-not-reported}"
            printf '| Phase | Duration | Exit code |\n|---|---:|---:|\n'
            if [ -f "$bench/timings.tsv" ]; then
              while IFS=$'\t' read -r phase seconds code; do
                [ "$phase" != 'phase' ] || continue
                printf '| %s | %dm %02ds | %s |\n' "$phase" "$((seconds / 60))" "$((seconds % 60))" "$code"
              done < "$bench/timings.tsv"
            fi
            printf '\nMeasured commands only. Checkout, cache transfer, queueing and other jobs are not included.\n'
            printf 'Use the workflow Total duration for wall-clock comparison. A first run may have a cold target cache.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$bench/workspace-tests.log" ]; then
            # Parse only explicit libtest summaries. These are per-binary runtimes,
            # not compilation times or the wall-clock duration of the full workflow.
            awk '
              { gsub(/\033\[[0-9;]*m/, "") }
              /Running unittests |Running tests\// { suite=$0; sub(/^[[:space:]]+/, "", suite) }
              /test result:/ && /finished in [0-9.]+s/ {
                elapsed=$0
                sub(/.*finished in /, "", elapsed)
                sub(/s.*/, "", elapsed)
                if (suite != "") printf "%s\t%s\n", elapsed, suite
              }
            ' "$bench/workspace-tests.log" | LC_ALL=C sort -k1,1nr > "$bench/test-binary-times.tsv"
            if [ -s "$bench/test-binary-times.tsv" ]; then
              {
                printf '\n### Slowest test binaries (reported by libtest)\n\n'
                printf '| Seconds | Test binary |\n|---:|---|\n'
                sed -n '1,10p' "$bench/test-binary-times.tsv" | while IFS=$'\t' read -r seconds binary; do
                  printf '| %s | `%s` |\n' "$seconds" "$binary"
                done
                printf '\nDiagnostic list only; custom harnesses without a libtest summary are not counted here.\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ -d target/cargo-timings ]; then
            mkdir -p "$bench"
            cp -R target/cargo-timings "$bench/"
          fi
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark-interop-real-backend
          path: ${{ runner.temp }}/dom-ci-benchmark/
          if-no-files-found: warn
          retention-days: 14
  release-blocker-crate-tests:
    name: "release blockers: crate tests (linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

        id: rust
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        # Cache hits never skip builds or tests. Cargo still validates fingerprints.
        # The compiler/profile prefix prevents stale incompatible target restores.
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dom-ci-v2-release-blocker-crate-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-original-target-${{ hashFiles('**/Cargo.lock', 
            '**/Cargo.toml', 'rust-toolchain', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            dom-ci-v2-release-blocker-crate-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-original-target-

        id: cargo-cache
      - name: Install Linux build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: cargo check --workspace
        run: cargo check --workspace --locked

      - name: cargo test -p dom-consensus
        run: cargo test -p dom-consensus --locked

      - name: cargo test -p dom-chain
        run: cargo test -p dom-chain --locked

      - name: cargo test -p dom-store
        run: cargo test -p dom-store --locked

      - name: cargo test -p dom-node (serial shutdown/supervisor coverage)
        run: cargo test -p dom-node --locked -- --test-threads=1

      - name: cargo test -p dom-mempool
        run: cargo test -p dom-mempool --locked

  release-blocker-integration-tests:
    name: "release blockers: dom-integration-tests (linux fast mining)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOM_NETWORK: regtest
      DOM_REGTEST_FAST_MINING: "1"
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "3"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

        id: rust
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        # Cache hits never skip builds or tests. Cargo still validates fingerprints.
        # The compiler/profile prefix prevents stale incompatible target restores.
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dom-ci-v2-release-blocker-integration-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-o${{ env.CARGO_PROFILE_TEST_OPT_LEVEL 
            }}-checks-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            dom-ci-v2-release-blocker-integration-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-o${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-checks-target-

        id: cargo-cache
      - name: Install Linux build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: cargo test -p dom-integration-tests
        run: cargo test -p dom-integration-tests --locked -- --test-threads=1

      - name: cargo test -p dom-integration-tests --ignored
        run: cargo test -p dom-integration-tests --locked -- --ignored --test-threads=1

  ibd-integration:
    name: ibd-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOM_NETWORK: regtest
      DOM_REGTEST_FAST_MINING: "1"
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "3"
      CARGO_PROFILE_TEST_DEBUG: "0"
      DOM_INTEGRATION_LOG_DIR: ${{ github.workspace }}/ibd-two-node-logs
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

        id: rust
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        # Cache hits never skip builds or tests. Cargo still validates fingerprints.
        # The compiler/profile prefix prevents stale incompatible target restores.
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dom-ci-v2-ibd-integration-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-o${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-checks-target-${{ 
            hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            dom-ci-v2-ibd-integration-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-o${{ env.CARGO_PROFILE_TEST_OPT_LEVEL }}-checks-target-

        id: cargo-cache
      - name: Install Linux build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: cargo build --release -p dom-node
        run: cargo build --release -p dom-node --locked

      - name: cargo test -p dom-integration-tests --test ibd_two_node
        run: |
          mkdir -p "$DOM_INTEGRATION_LOG_DIR"
          cargo test -p dom-integration-tests --test ibd_two_node --locked -- --nocapture --test-threads=1

      - name: Upload IBD node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ibd-integration-logs
          path: ibd-two-node-logs
          if-no-files-found: warn

  release-blocker-gate:
    name: release blocker gate
    runs-on: ubuntu-latest
    # All original dependencies remain mandatory. Snapshot equivalence also gates release.
    needs:
      - fmt
      - supply-chain
      - build-test
      - interop-evm-contracts
      - interop-real-backend
      - release-blocker-crate-tests
      - release-blocker-integration-tests
      - ibd-integration
      - pmmr-vectors-cross-platform
      - compare-snapshots
    if: always()
    steps:
      - name: Require every release-blocker job to pass
        run: |
          test "${{ needs.fmt.result }}" = "success"
          test "${{ needs.supply-chain.result }}" = "success"
          test "${{ needs.build-test.result }}" = "success"
          test "${{ needs.interop-evm-contracts.result }}" = "success"
          test "${{ needs.interop-real-backend.result }}" = "success"
          test "${{ needs.release-blocker-crate-tests.result }}" = "success"
          test "${{ needs.release-blocker-integration-tests.result }}" = "success"
          test "${{ needs.ibd-integration.result }}" = "success"
          test "${{ needs.pmmr-vectors-cross-platform.result }}" = "success"
          test "${{ needs.compare-snapshots.result }}" = "success"

  critical-domain-coverage-report:
    name: critical domain coverage report
    runs-on: ubuntu-latest
    needs: release-blocker-gate
    steps:
      - uses: actions/checkout@v4

      - name: Generate critical domain coverage report
        run: scripts/critical_domain_coverage_report.sh > critical-domain-coverage.md

      - name: Upload critical domain coverage report
        uses: actions/upload-artifact@v4
        with:
          name: critical-domain-coverage
          path: critical-domain-coverage.md

  pmmr-vectors-cross-platform:
    name: pinned PMMR vectors must reproduce on ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    # Independent checkout: run after the short format gate, not after the heavy matrix.
    # Every vector test, reproducer, audit log and snapshot upload is retained.
    needs: fmt
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-latest
            experimental: false
          - host: linux-arm64
            runner: ubuntu-22.04-arm
            experimental: false
          - host: macos-arm64
            runner: macos-latest
            experimental: false
          - host: macos-x86_64
            runner: macos-15-intel
            experimental: false
          - host: windows-x86_64
            runner: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      # The pinned RFC-0004 hex vectors are the cross-platform contract
      # for the PMMR layout. If this leg fails on a runner where
      # build-test passed, the protocol has lost cross-platform
      # determinism on that platform.
      - name: Run pinned PMMR vector tests
        run: |
          cargo test -p dom-test-vectors --lib pmmr_vectors --locked

      - name: Run hash + serialization vector tests
        run: |
          cargo test -p dom-test-vectors --lib hash_vectors --locked
          cargo test -p dom-test-vectors --lib serialization_vectors --locked

      - name: Run PMMR adversarial + reproducer suite
        run: |
          cargo test -p dom-pmmr --tests --locked

      - name: Print pinned PMMR vectors (cross-platform audit log)
        run: |
          cargo test -p dom-test-vectors --lib pmmr_vectors::tests::print_pmmr_vectors --locked -- --nocapture

      # Phase 1.4 deterministic snapshot manifest — every host
      # produces the SAME byte sequence. The compare-snapshots job
      # (below) downloads every host's artifact and asserts they
      # are byte-identical. Any divergence is a consensus-class
      # cross-platform regression.
      - name: Generate deterministic snapshot manifest
        shell: bash
        run: |
          cargo run -p dom-test-vectors --bin cross_platform_snapshot --quiet --locked \
            > snapshot.${{ matrix.host }}.txt
          wc -c snapshot.${{ matrix.host }}.txt
          head -5 snapshot.${{ matrix.host }}.txt

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.host }}
          path: snapshot.${{ matrix.host }}.txt
          if-no-files-found: error

  compare-snapshots:
    name: cross-platform snapshot byte-equivalence
    runs-on: ubuntu-latest
    needs: pmmr-vectors-cross-platform
    steps:
      - uses: actions/checkout@v4

      - name: Download every host's snapshot
        uses: actions/download-artifact@v4
        with:
          pattern: snapshot-*
          path: snapshots
          merge-multiple: true

      # The non-experimental matrix legs (linux-x86_64, linux-arm64,
      # macos-arm64, macos-x86_64) MUST produce a byte-identical
      # manifest. Windows is `continue-on-error: true` in the
      # matrix above and is therefore tolerated here too — its
      # divergence does NOT fail the gate until the MSVC build
      # path is green (RB-PMMR-001 deferred-validation list).
      - name: Diff snapshots across non-experimental hosts
        run: |
          set -euo pipefail
          ls -la snapshots/
          REFERENCE=snapshots/snapshot.linux-x86_64.txt
          if [ ! -s "$REFERENCE" ]; then
            echo "FATAL: reference snapshot ${REFERENCE} missing — linux-x86_64 leg did not upload"
            exit 1
          fi
          REQUIRED_HOSTS="linux-arm64 macos-arm64 macos-x86_64"
          for host in $REQUIRED_HOSTS; do
            CANDIDATE="snapshots/snapshot.${host}.txt"
            if [ ! -s "$CANDIDATE" ]; then
              echo "FATAL: missing snapshot for required host ${host}"
              exit 1
            fi
            if ! diff -u "$REFERENCE" "$CANDIDATE"; then
              echo "DIVERGENCE: ${host} differs from linux-x86_64 reference"
              exit 1
            fi
            echo "OK: ${host} byte-identical to linux-x86_64"
          done
          # Advisory diff against Windows (continue-on-error).
          if [ -f snapshots/snapshot.windows-x86_64.txt ]; then
            if diff -u "$REFERENCE" snapshots/snapshot.windows-x86_64.txt > /dev/null; then
              echo "BONUS: windows-x86_64 ALSO byte-identical"
            else
              echo "ADVISORY: windows-x86_64 diverges (expected until RB-PMMR-001 MSVC pinning):"
              diff -u "$REFERENCE" snapshots/snapshot.windows-x86_64.txt || true
            fi
          fi
