name: XMR interoperability V7
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/adapters/xmr-**'
      - 'crates/f8-xmr-kaystra-e2e/**'
      - 'crates/adapters/dom-real/src/lib.rs'
      - 'external-gpl/dom-xmr-sidecar/**'
      - 'scripts/xmr-v7-**'

jobs:
  dom-xmr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 scripts/xmr-v7-static-validate.py .
      - run: cargo fmt --all -- --check
      - run: cargo test -p xmr-crypto -p xmr-dleq-sigma -p xmr-route-secret -p xmr-setup-profile -p xmr-dleq-nullifier-store -p xmr-refund-policy -p xmr-secret-store -p xmr-evidence -p xmr-observer -p xmr-observation-store -p xmr-observer-pump -p xmr-kaystra-records -p xmr-kaystra-source -p xmr-delivery -p xmr-delivery-sqlite -p xmr-live-sidecar-api -p xmr-sidecar-auth -p xmr-spend-port -p xmr-live-sidecar-blocking-client -p xmr-live-sidecar-uds-client -p xmr-rpc-broadcast-blocking -p xmr-kaystra-bridge -p xmr-runtime-wiring -p xmr-session-init -p f8-xmr-kaystra-e2e
      - run: cargo clippy -p xmr-crypto -p xmr-dleq-sigma -p xmr-route-secret -p xmr-setup-profile -p xmr-dleq-nullifier-store -p xmr-refund-policy -p xmr-secret-store -p xmr-evidence -p xmr-observer -p xmr-observation-store -p xmr-observer-pump -p xmr-kaystra-records -p xmr-kaystra-source -p xmr-delivery -p xmr-delivery-sqlite -p xmr-live-sidecar-api -p xmr-sidecar-auth -p xmr-spend-port -p xmr-live-sidecar-blocking-client -p xmr-live-sidecar-uds-client -p xmr-rpc-broadcast-blocking -p xmr-kaystra-bridge -p xmr-runtime-wiring -p xmr-session-init -p f8-xmr-kaystra-e2e --all-targets -- -D warnings

  eigenwallet-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dom
      - uses: actions/checkout@v4
        with:
          repository: eigenwallet/core
          ref: 0e17c7f7cd8f0657af176c8852aa4c9949586051
          path: eigenwallet
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 dom/scripts/install-sidecar-into-eigenwallet.py eigenwallet
      - run: cargo check --manifest-path eigenwallet/Cargo.toml -p dom-xmr-sidecar
      - run: cargo check --locked --manifest-path eigenwallet/Cargo.toml -p dom-xmr-sidecar
      - run: cargo test --locked --manifest-path eigenwallet/Cargo.toml -p dom-xmr-sidecar
