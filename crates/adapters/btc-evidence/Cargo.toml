# Bitcoin evidence verifier and USPE bridge (Annex M M.9.3, M.9.5).
#
# The trust-minimized, replaceable, NON-CUSTODIAL evidence module (M.9.1):
# it verifies headers, inclusion, witness and outcome rules and produces a
# VerifiedBitcoinOutcomeV1. It NEVER signs, funds, selects a nonce, adapts
# a signature or holds custody, and it never sees `t` (M.0.4, M.9.1). The
# USPE consumes only the verified public outcome + terms_hash.
#
# The verifier reuses the audited `bitcoin` crate for double-SHA256,
# header targets and transaction parsing (reimplementing them would be
# less safe and is forbidden by M.0.4). This is the native evidence
# module; the operator-owned Keystone (BUSL) is the ratifiable
# alternative recorded as D-015.
[package]
name = "btc-evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true  # MIT by being DOM (absorption licence-by-inheritance)
publish = false  # D-ORQ-9: explicit, never inherited

[dependencies]
thiserror = { workspace = true }
bitcoin = "=0.32.5"
uspe = { path = "../../uspe" }

[dev-dependencies]
hex = "=0.4.3"
