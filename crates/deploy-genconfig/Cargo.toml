[package]
name = "deploy-genconfig"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: see the exclusion note in the repository root manifest.
[workspace]

[dependencies]
dom-interopd = { path = "../dom-interopd", default-features = false, features = ["production"] }
deployment-registry = { path = "../deployment-registry" }
chain-profile = { path = "../chain-profile" }
btc-crypto = { path = "../adapters/btc-crypto" }
kaystra-core = { path = "../kaystra-core", default-features = false }
adapter-btc = { path = "../adapters/btc" }
adapter-evm = { path = "../adapters/evm" }
dom-consensus = { path = "../dom-consensus" }
dom-core = { path = "../dom-core" }
hex = { version = "0.4" }
serde_json = { version = "1.0" }
rand = { version = "0.8" }
zeroize = { version = "1.7", features = ["derive"] }
blake2 = { version = "0.10" }

[dev-dependencies]
tempfile = { version = "3.10" }


