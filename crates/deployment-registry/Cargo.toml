[package]
name = "deployment-registry"
description = "Signed, canonical and rollback-resistant deployment registry for the DOM interoperability runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
adapter-btc = { path = "../adapters/btc" }
adapter-evm = { path = "../adapters/evm" }
btc-crypto = { path = "../adapters/btc-crypto" }
blake2 = { workspace = true }
bitcoin = "=0.32.5"
chain-profile = { path = "../chain-profile" }
dom-consensus.workspace = true
dom-core.workspace = true
dom-crypto.workspace = true
kaystra-core = { path = "../kaystra-core", default-features = false }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["process"] }

[dev-dependencies]
# Only to re-derive the Monero genesis block hashes in a test, so the
# constants in `RATIFIED_MONERO_GENESIS` are computed rather than trusted.
# The same pinned revision the XMR raw-transaction verifier uses.
monero-oxide = { git = "https://github.com/kayabaNerve/monero-oxide", rev = "c8be5d3d1287669946a83fbfcb296ce2a8852e47" }
tempfile = { workspace = true }
