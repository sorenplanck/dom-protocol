[package]
name = "dom-adaptor"
description = "DOM Scriptless Contracts adaptor-signature integration boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Laboratory seam that mints one claim observation from a crypto-real opening.
# No shipped feature enables it and it is a hard compile error in release.
evidence-only = []

[dependencies]
dom-scriptless-primitives = { path = "../dom-scriptless-primitives" }
dom-scriptless-bulletproof = { path = "../dom-scriptless-bulletproof" }
dom-scriptless-consensus = { path = "../dom-scriptless-consensus" }
dom-core.workspace = true
dom-crypto.workspace = true
dom-consensus.workspace = true
dom-serialization.workspace = true
thiserror.workspace = true
rand_core.workspace = true
zeroize.workspace = true
subtle.workspace = true

[dev-dependencies]
dom-crypto = { workspace = true, features = ["test-helpers"] }
hex.workspace = true
serde_json.workspace = true
k256.workspace = true
static_assertions = "=1.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
