[package]
name = "dom-adaptor"
description = "DOM Scriptless Contracts adaptor-signature integration boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
fuzzing = []
# Evidence-only access to quarantined nonce lifecycle APIs. Production users
# must not enable this feature; G1b integration will provide the durable gate.
test-helpers = ["dom-crypto/test-helpers"]

[dependencies]
dom-core.workspace = true
dom-crypto = { workspace = true, features = ["scriptless-integrated"] }
dom-consensus.workspace = true
thiserror.workspace = true
rand_core.workspace = true
zeroize.workspace = true

[dev-dependencies]
dom-crypto = { workspace = true, features = ["test-helpers"] }
dom-serialization.workspace = true
hex.workspace = true
