[package]
name = "dom-adaptor"
description = "DOM Scriptless Contracts adaptor-signature integration boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []

[dependencies]
dom-core.workspace = true
dom-crypto.workspace = true
dom-consensus.workspace = true
thiserror.workspace = true
rand_core.workspace = true
zeroize.workspace = true

[dev-dependencies]
dom-crypto = { workspace = true, features = ["test-helpers"] }
dom-serialization.workspace = true
hex.workspace = true
serde_json.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
