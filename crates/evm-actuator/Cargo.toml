[package]
name = "evm-actuator"
description = "Durable, scoped EIP-1559 transaction authority for DOM interoperability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
rpc-http = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
adapter-evm = { path = "../adapters/evm", default-features = false }
deployment-registry = { path = "../deployment-registry" }
k256 = { workspace = true }
reqwest = { workspace = true, optional = true }
rusqlite = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process"] }

[dev-dependencies]
adapter-btc = { path = "../adapters/btc" }
btc-crypto = { path = "../adapters/btc-crypto" }
chain-profile = { path = "../chain-profile" }
hex = { workspace = true }
kaystra-core = { path = "../kaystra-core", default-features = false }
static_assertions = "=1.1.0"
tempfile = { workspace = true }
