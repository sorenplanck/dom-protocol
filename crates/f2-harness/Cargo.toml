[package]
name = "f2-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true  # MIT by being DOM (absorption licence-by-inheritance)
publish = false  # D-ORQ-9: explicit, never inherited

# Composition harness for gate G-F2. NOT production code: it exists to
# tie together engine + dom-sim + USPE in the fault-injection tests.
[dependencies]
counterparty-api = { workspace = true }
kaystra-core = { path = "../kaystra-core" }
uspe = { path = "../uspe" }
adapter-dom-sim = { path = "../adapters/dom-sim" }

[dev-dependencies]
# The recovery tests tamper with the database directly to prove the
# engine fails closed instead of trusting a snapshot it cannot replay.
rusqlite = { workspace = true }
# Crash injection at the eleven boundaries of F2 spec §13. Test-only:
# the feature is off by default and no production dependency enables it.
store = { workspace = true, features = ["failpoints"] }
# LAB (NOT RATIFIED): the composed-route engine proof derives the shared
# adaptor point T = t*G with the same real secp helper the EVM leg uses, so
# the engine composition is tied to the level-1 cryptographic binding.
adapter-evm = { path = "../adapters/evm" }
