[package]
name = "f6-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false  # D-ORQ-9: explicit, never inherited
# F6 spec v1.0.1 build-order step 3 (D-018): the exclusive bond
# reservation ledger over the F4 objects and the atomic section-4.2
# binding transition, journaled under kind 0xF601 on the ratified store
# (append-before-effects, replay-verified — the F4 DurableAssurance
# precedent). It holds no key and signs nothing.

[dependencies]
kaystra-core = { path = "../kaystra-core" }
rfq = { path = "../rfq" }
# D-019: the recipient-side payload check lives HERE, never in `relay`.
# `relay` does not depend on `rfq`, so the Relay cannot decode an F6
# object even by accident (spec section 6.2, structural).
relay = { path = "../relay" }
store = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
# D-019 test 11 runs the consumer check behind the REAL section-5.4
# pipeline, so the payload is judged only after a real BIP340 signature
# verified — a consumer test on a hand-built envelope would prove less.
btc-crypto = { path = "../adapters/btc-crypto" }
# Step 7 (spec section 6.3) proves that losing the Relay costs a session
# its transport and NOTHING else. That claim is only measurable against
# the real terminal machines, so the suite drives the REAL F2 settlement
# engine over real SQLite and a simulated chain, and the REAL F4
# assurance journal to Compensated. Neither harness depends on this
# crate, so there is no cycle.
f2-harness = { path = "../../../dom-interop/crates/f2-harness" }  # dev-only: audit harness, retained in the residual Interop repository (absorption of 2026-08-25)
f4-harness = { path = "../../../dom-interop/crates/f4-harness" }  # dev-only: idem
uspe = { path = "../uspe" }
