[package]
name = "route-composer"
description = "DOM Interop — composed cross-chain route binding: two settlements, one adaptor point, fail-closed window/ordering/scalar guards (Foundation §1.2 DOM-hub; NOT RATIFIED)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false  # D-ORQ-9: explicit, never inherited
[dependencies]
# Terms/types/state only — the composer never opens an engine itself, so the
# persistence port stays out of its dependency surface (§4.2 boundary).
kaystra-core = { path = "../kaystra-core", default-features = false }
# The composed treasury rate, charged ONCE per route (fee ADR / fee_policy).
rfq = { path = "../rfq" }
# T = t*G recomputation for the scalar hand-off, through the SAME secp helper
# the EVM leg and the level-1/level-2 composed proofs already use (I15: reuse,
# never a second implementation).
adapter-evm = { path = "../adapters/evm" }
route-time-anchor = { path = "../route-time-anchor" }
dom-final-claim-binding = { path = "../dom-final-claim-binding" }
# Same exact hash crate and version as kaystra-core, uspe and rfq: one
# BLAKE2b-256 implementation across every canonical digest (I15).
blake2 = "=0.10.6"
thiserror = { workspace = true }
# Scalar hygiene: the revealed route scalar lives only in zeroizing memory.
zeroize = { workspace = true }
# Point algebra of the leg-offset relation proof (DR-PRIV-001, Level 1):
# secp256kfun EXACTLY as xmr-dleq-sigma already links it, through the same
# sigma_fun pin — never a second secp implementation (I15).
sigma_fun = { version = "=0.7.0", default-features = false, features = ["secp256k1", "alloc"] }
# Constant-time nonzero check on derived leg witnesses/offsets.
subtle = { workspace = true }
# The closed DLEQ role registry: role byte 4 (leg-offset-relation) is
# minted THERE and re-exported here — this crate never defines a role
# byte of its own (L1 package §6; enforced by the static role gate).
xmr-dleq-sigma = { path = "../adapters/xmr-dleq-sigma" }

[dev-dependencies]
# The integration proof drives two REAL durable engines through the composer,
# mirroring the level-2 composed-routes evidence.
kaystra-core = { path = "../kaystra-core" }
f2-harness = { path = "../f2-harness" }  # dev-only: audit harness, retained in the residual Interop repository (absorption of 2026-08-25)
adapter-btc = { path = "../adapters/btc" }
bitcoin = "=0.32.5"
btc-crypto = { path = "../adapters/btc-crypto" }
chain-profile = { path = "../chain-profile" }
deployment-registry = { path = "../deployment-registry" }
dom-consensus.workspace = true
dom-core.workspace = true
hex.workspace = true
tempfile.workspace = true
# Property-based invariants of the ladder, the digest and the hand-off
# (same exact pin as rfq and kaystra-core).
proptest = "=1.7.0"
# The V3 leg-blinding integration test drives role-bound DLEQ proofs
# (roles 1..3) over blinded witnesses; prove_bound needs an OS rng.
rand = { workspace = true }
