[package]
name = "route-transport"
description = "DOM Interop — the route's DSC1 messages over Relay V1 as RouteTransportV1 (0x0005, D-029): sender/recipient bridge with the full §5.4 pipeline; closes the F7 §7.1 open row legitimately (NOT RATIFIED)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false  # D-ORQ-9: explicit, never inherited
[dependencies]
# Relay V1: the ratified store-and-forward reference and the §5.4
# validation pipeline, at its DEFAULT feature set — the shipped and
# gate-tested combination (real-bip340 + production-durable). A bridge
# that cannot verify what it accepts has no value.
relay = { path = "../relay" }
# The pinned D-013 BIP340 backend for envelope signing (I15: the same
# backend the Relay verifies with).
btc-crypto = { path = "../adapters/btc-crypto" }
thiserror = { workspace = true }
# Digest32 and the shared id types (the same alias the relay itself uses).
kaystra-core = { path = "../kaystra-core", default-features = false }
# The sender's signing secret lives only in zeroizing memory (I6).
zeroize = { workspace = true }
# The durable recipient inbox uses the workspace-pinned SQLite/WAL backend
# and the same BLAKE2b-256 family as Relay V1.  They are Linux-only because
# the retained single-writer authority relies on owner/mode checks and flock.
blake2 = "=0.10.6"

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { workspace = true }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]
tempfile = "=3.24.0"
dom-scriptless-store = { path = "../dom-scriptless-store", features = ["evidence-only"] }
dom-scriptless-crypto = { path = "../dom-scriptless-crypto" }
dom-scriptless-transport = { path = "../dom-scriptless-transport" }
dom-crypto.workspace = true
cap-std.workspace = true
