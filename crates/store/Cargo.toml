[package]
name = "store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false  # D-ORQ-9: explicit, never inherited
# Neutral persistence for the protocol. This crate does NOT know about
# `dom-adaptor`, secret nonces, shares or `AdaptorSecret` (D-005, §4.2,
# grep-gate in CI). The durable cryptographic implementation of `NonceVaultV1`
# lives in `dom-vault`.
# `failpoints` compiles the crash-injection hooks of F2 spec §13 into the
# commit and dispatch boundaries. It is OFF by default, is enabled only by
# test targets, and `scripts/guards.sh` fails the build if any crate turns
# it on as a normal dependency or as a default feature.
[features]
default = []
failpoints = []

[dependencies]
rusqlite = { workspace = true }
# `std` is not optional here: `lib.rs` hands `std::os::fd::BorrowedFd` to
# `rustix::fs::flock`, and without this feature `rustix` defines its own
# `BorrowedFd` and the call does not type-check. It built until now only
# because the dev-dependency on `tempfile` enabled `rustix/std` in the same
# resolution unit; any unit that builds this crate as a plain dependency
# had no such accident.
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "=3.24.0"  # aligned up to the Contracts pin at absorption (dev-only; exact pin preserved)
store = { path = ".", features = ["failpoints"] }
