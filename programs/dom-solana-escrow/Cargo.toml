[package]
name = "dom-solana-escrow"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
solana-program = "=2.3.0"
solana-curve25519 = "=4.0.1"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
solana-escrow-wire = { path = "../../crates/adapters/solana-escrow-wire" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic", "frozen-abi", "no-entrypoint"))',
]

[dev-dependencies]
curve25519-dalek = "4"

[workspace]
resolver = "2"
